version: '3.8'

services:
  db:
    image: postgres:17
    container_name: toyshop_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - my-network

  app:
    build: .
    container_name: toyshop_app
    image: aishiba-app:latest
    ports:
      - "8080:8080"
    volumes:
      - ./target/Aishiba-1.0-SNAPSHOT.war:/usr/local/tomcat/webapps/Aishiba.war
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - my-network

volumes:
  postgres-data:
    driver: local

networks:
  my-network:
    driver: bridge